<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete your request</title>
    <link rel="stylesheet" href="portal.css" />
</head>
<body>
<div id="app" class="wrap">
    <div id="loading" class="state">
        <p>Loading your request…</p>
    </div>

    <div id="error" class="state hidden">
        <h1>This link isn't valid</h1>
        <p id="errorMessage">Please contact the business that sent you this link.</p>
    </div>

    <div id="content" class="hidden">
        <header class="header">
            <img id="logo" class="logo hidden" alt="" />
            <div>
                <h1 id="businessName">Business</h1>
                <p class="intro">needs the following from you:</p>
            </div>
        </header>

        <div class="progress">
            <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            <p id="progressLabel" class="progress-label">0 of 0 completed</p>
        </div>

        <ul id="itemsList" class="items"></ul>

        <div id="completeBanner" class="complete-banner hidden">
            <h2>Thank you — everything has been received.</h2>
            <p>No further action is needed. The business has been notified.</p>
        </div>
    </div>
</div>

<script type="module" src="portal.js"></script>
</body>
</html>
